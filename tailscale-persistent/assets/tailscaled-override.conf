# Drop-in override for the OFFICIAL tailscaled.service.
# Install to: /etc/systemd/system/tailscaled.service.d/override.conf
# Then: systemctl daemon-reload && systemctl restart tailscaled.service
#
# Why this exists: some sandboxed / proxied environments export
# HTTP(S)_PROXY / ALL_PROXY into systemd's environment, and the leaked proxy
# breaks the Tailscale control-plane handshake (HTTP 400). The official unit
# has no UnsetEnvironment of its own, so we add it via drop-in instead of
# replacing the whole unit.

[Service]
UnsetEnvironment=HTTP_PROXY HTTPS_PROXY http_proxy https_proxy ALL_PROXY all_proxy
